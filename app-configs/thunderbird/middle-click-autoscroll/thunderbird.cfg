// Managed by https://github.com/tomjseery/dotfiles.
// midscroll owns Thunderbird's middle button because Gecko's built-in actor
// does not cover the message-list UI. Keep native autoscroll disabled so two
// services never process the same click.
pref("general.autoScroll", false);
pref("general.autoscroll", false);
pref("middlemouse.paste", false);
pref("middlemouse.contentLoadURL", false);
// Make scrollable regions visible instead of relying on transient GTK overlay
// scrollbars, which makes the three-pane layout needlessly ambiguous.
pref("widget.gtk.overlay-scrollbars.enabled", false);
pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
