# --- background image (Zero Two, faded behind text) ---
# background_tint: 0 = image full strength, 1 = hidden. Raise it if text is
# hard to read, lower it to make Zero Two more visible.
background_image /home/tommy/Pictures/wallpapers/terminal_bg.png
background_image_layout cscaled
background_tint 0.5
background_tint_gaps 0

# --- base ---
background  #17070e
foreground  #F8F8F2
cursor      #1ecd86
cursor_text_color background

selection_background #9B6BDF
selection_foreground #17070e

# --- normal colors ---
color0  #1f0f17
color1  #E356A7
color2  #42E66C
color3  #EFA554
color4  #9B6BDF
