# Managed by https://github.com/tomjseery/dotfiles.
# Apply changes with: install-mouse-config

# Windows-style autoscroll speed curve:
# speed (px/sec) = SPEED_MULT * (pixels dragged) ^ SPEED_EXP per axis.
DEADZONE_PX = 15
SPEED_MULT = 0.008
SPEED_EXP = 2.2
MAX_PX_PER_SEC = 30000
PX_PER_NOTCH = 55
MAX_DRAG_PX = 1200
TICK_HZ = 90
NATURAL = false

# Preserve native middle clicks (open links in a new tab, paste, and app
# actions). Hold MMB and move beyond the dead zone to start autoscroll;
# releasing MMB stops it. Toggle mode cannot distinguish a link click from an
# autoscroll request, so it must remain disabled for system-wide use.
TOGGLE_MODE = false

# Do not take middle clicks from the Plasma desktop or panels.
DESKTOP_SCROLL = false

# The per-user midscroll-overlay service draws the anchor badge and ghost cursor
# in a Plasma Wayland session. It also reports the focused application so the
# small native-middle-drag blacklist works.
GHOST_CURSOR = true
GHOST_SCALE = 1.0
SNAP_CURSOR_ON_RELEASE = true

# Only exclude applications where middle-drag has an intentional native action.
# Browsers, Electron apps, Thunderbird, terminals, and ordinary desktop apps
# all use midscroll, leaving exactly one owner for MMB across the desktop.
# Matching is case-insensitive against the focused window's WM_CLASS/app id.
BLACKLIST = freecad, orcaslicer, minecraft

EXTRA_DEVICES =

# input-remapper creates this virtual device even when no preset is injected.
# Ignoring it prevents a grab loop/conflict if input-remapper is used later.
IGNORE_DEVICES = input-remapper mouse
