# ~/.config/kitty/kitty.conf
# Doki Theme — "Zero Two Dark Obsidian", to match Neovim + VS Code.
# Palette pulled from the VS Code Doki theme; gaps (black/white/bright)
# filled with brightened variants of the same colors.

# --- general ---
font_size 12.0
cursor_shape beam
cursor_blink_interval 0
scrollback_lines 10000
enable_audio_bell no
window_padding_width 6
confirm_os_window_close 0

# --- background image (Zero Two, faded behind text) ---
# background_tint: 0 = image full strength, 1 = hidden. Raise it if text is
# hard to read, lower it to make Zero Two more visible.
background_image /home/tommy/Pictures/wallpapers/terminal_bg.png
background_image_layout cscaled
background_tint 0.5
background_tint_gaps 0

# --- base ---
background  #17070e
foreground  #F8F8F2
cursor      #1ecd86
cursor_text_color background

selection_background #9B6BDF
selection_foreground #17070e

# --- normal colors ---
color0  #1f0f17
color1  #E356A7
color2  #42E66C
color3  #EFA554
color4  #9B6BDF
color5  #E64747
color6  #75D7EC
color7  #F8F8F2

# --- bright colors ---
color8  #7a5e6b
color9  #ff7ac0
color10 #76ff9b
color11 #ffc98a
color12 #c4a3ff
color13 #ff7d7d
color14 #acecff
color15 #ffffff

# Disable middle-click paste (primary selection paste is bollocks)
mouse_map middle release ungrabbed no_op
