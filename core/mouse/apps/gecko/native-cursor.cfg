// Managed by dotfiles/core/mouse: native autoscroll cursor presentation.
(() => {
  const { classes: Cc, interfaces: Ci, results: Cr } = Components;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const override = env.get("MIDSCROLL_CURSOR_STATE_SOCKET");
  if (!override && !env.get("XDG_CURRENT_DESKTOP").toUpperCase().split(":").includes("KDE")) return;
  const path = override || "/run/midscroll/state.sock";
  const observers = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  const windows = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
  const sockets = Cc["@mozilla.org/network/socket-transport-service;1"].getService(Ci.nsISocketTransportService);
  let currentStop = null;
  const attach = win => {
    if (!win.gBrowser || win.__dotfilesAutoscrollCursor) return;
    win.__dotfilesAutoscrollCursor = true;
    let active = null;
    const report = (state, value) => {
      const message = `presentation ${JSON.stringify({ version: 1, active: value })}\n`;
      if (state.output.write(message, message.length) !== message.length)
        throw new Error("Incomplete presentation report");
    };
    const stop = () => {
      const state = active;
      if (!state) return;
      active = null;
      if (state.timer !== null) win.clearInterval(state.timer);
      state.popup.style.opacity = state.opacity;
      // A false report is advisory; closing the connection always revokes its lease.
      try { if (state.output) report(state, false); } catch {}
      try { if (state.pump) state.pump.cancel(Cr.NS_BINDING_ABORTED); } catch {}
      try { if (state.transport) state.transport.close(Cr.NS_BINDING_ABORTED); } catch {}
      if (currentStop === stop) currentStop = null;
    };
    const valid = state => active === state
      && win.gBrowser.selectedBrowser === state.browser
      && !!state.browser._autoScrollBrowsingContext
      && state.browser._autoScrollPopup === state.popup
      && state.popup.state === "open";
    const start = (browser, popup) => {
      if (currentStop) currentStop();
      const state = {
        browser, popup, opacity: popup.style.opacity, transport: null,
        output: null, pump: null, timer: null, input: "", lastAck: win.performance.now(),
      };
      active = state;
      currentStop = stop;
      try {
        const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        file.initWithPath(path);
        state.transport = sockets.createUnixDomainTransport(file);
        state.output = state.transport.openOutputStream(0, 0, 0);
        const input = state.transport.openInputStream(0, 0, 0);
        state.pump = Cc["@mozilla.org/network/input-stream-pump;1"].createInstance(Ci.nsIInputStreamPump);
        state.pump.init(input, 0, 0, true);
        state.pump.asyncRead({
          QueryInterface: ChromeUtils.generateQI(["nsIStreamListener", "nsIRequestObserver"]),
          onStartRequest() {},
          onDataAvailable(_request, stream, _offset, count) {
            if (active !== state) return;
            try {
              if (count > 4096 || state.input.length + count > 4096)
                throw new Error("Oversized presentation response");
              const bytes = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
              bytes.init(stream);
              state.input += bytes.readBytes(count);
              let end;
              while ((end = state.input.indexOf("\n")) >= 0) {
                const line = state.input.slice(0, end);
                state.input = state.input.slice(end + 1);
                // Legacy state broadcasts are not presentation acceptance.
                if (line === "0" || line === "1") continue;
                if (!line.startsWith("presentation "))
                  throw new Error("Unexpected presentation response");
                const reply = JSON.parse(line.slice(13));
                if (!reply || Object.keys(reply).sort().join(",") !== "accepted,version"
                    || reply.version !== 1 || typeof reply.accepted !== "boolean"
                    || !reply.accepted || !valid(state))
                  throw new Error("Presentation lease not accepted");
                state.lastAck = win.performance.now();
                // This acknowledges daemon acceptance, not a rendered-frame guarantee.
                state.popup.style.opacity = "0";
              }
            } catch { stop(); }
          },
          onStopRequest() { if (active === state) stop(); },
        });
        const tick = () => {
          if (!valid(state) || win.performance.now() - state.lastAck >= 300) {
            stop();
            return;
          }
          try { report(state, true); } catch { stop(); }
        };
        state.timer = win.setInterval(tick, 100);
        tick();
      } catch { stop(); }
    };
    win.addEventListener("popupshown", event => {
      if (event.target.id !== "autoscroller") return;
      win.requestAnimationFrame(() => {
        const browser = win.gBrowser.selectedBrowser;
        if (!browser._autoScrollBrowsingContext || browser._autoScrollPopup !== event.target
            || event.target.state !== "open") return;
        start(browser, event.target);
      });
    }, true);
    win.addEventListener("popuphidden", event => {
      if (event.target === active?.popup) stop();
    }, true);
    win.gBrowser.tabContainer.addEventListener("TabSelect", stop);
    win.addEventListener("deactivate", stop, true);
    win.addEventListener("unload", stop, { once: true });
  };
  observers.addObserver({ observe(subject) { attach(subject); } }, "browser-delayed-startup-finished");
  for (const win of windows.getEnumerator("navigator:browser")) attach(win);
})();
