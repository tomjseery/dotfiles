// Managed by dotfiles/core/mouse: native autoscroll cursor presentation.
(() => {
  const { classes: Cc, interfaces: Ci } = Components;
  const observers = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  const windows = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
  const attach = win => {
    if (!win.gBrowser || typeof win.setCursor !== "function" || win.__dotfilesAutoscrollCursor) return;
    win.__dotfilesAutoscrollCursor = true;
    let active = null;
    let popup = null;
    let previousOpacity = "";
    let cursor = "auto";
    const stop = () => {
      if (!active) return;
      if (popup) popup.style.opacity = previousOpacity;
      active = null;
      popup = null;
      cursor = "auto";
      win.setCursor("auto");
    };
    const move = event => {
      if (!active) return;
      if (!active._autoScrollBrowsingContext || win.gBrowser.selectedBrowser !== active) {
        stop();
        return;
      }
      const dx = event.screenX - active._startX;
      const dy = event.screenY - active._startY;
      const next = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? "e-resize" : "w-resize")
        : (dy > 0 ? "s-resize" : "n-resize");
      if (next !== cursor) {
        win.setCursor(next);
        cursor = next;
      }
    };
    win.addEventListener("popupshown", event => {
      if (event.target.id !== "autoscroller") return;
      win.requestAnimationFrame(() => {
        const browser = win.gBrowser.selectedBrowser;
        if (!browser._autoScrollBrowsingContext || browser._autoScrollPopup !== event.target
            || !Number.isFinite(browser._startX) || !Number.isFinite(browser._startY)) return;
        stop();
        active = browser;
        popup = event.target;
        previousOpacity = popup.style.opacity;
        // Keep the popup and its cancellation behaviour; only hide its paint.
        popup.style.opacity = "0";
        win.setCursor("n-resize");
        cursor = "n-resize";
      });
    }, true);
    win.addEventListener("mousemove", move, true);
    win.addEventListener("popuphidden", event => {
      if (event.target === popup) stop();
    }, true);
    win.addEventListener("deactivate", stop, true);
    win.addEventListener("unload", stop, { once: true });
  };
  observers.addObserver({
    observe(subject) { attach(subject); },
  }, "browser-delayed-startup-finished");
  for (const win of windows.getEnumerator("navigator:browser")) attach(win);
})();
