[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "midscroll-routing"
version = "0.1.0"
requires-python = ">=3.14"
description = "Native-default gesture ownership for the pinned midscroll package"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
    "mypy>=1.18",
    "evdev>=2.0.0",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest]
strict = true
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
