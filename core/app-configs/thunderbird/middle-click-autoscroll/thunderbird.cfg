// Managed by https://github.com/tomjseery/dotfiles.
// midscroll owns Thunderbird's middle button because Gecko's native
// autoscroll actor does not cover the message-list UI. Keep Gecko autoscroll
// disabled so exactly one handler processes Thunderbird MMB.
pref("general.autoScroll", false);
pref("general.autoscroll", false);
pref("middlemouse.paste", false);
pref("middlemouse.contentLoadURL", false);
pref("widget.gtk.overlay-scrollbars.enabled", false);
pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
