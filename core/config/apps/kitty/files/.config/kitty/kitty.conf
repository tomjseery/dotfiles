# Personal terminal behaviour; appearance is installed independently.
# --- general ---
font_size 12.0
cursor_shape beam
cursor_blink_interval 0
scrollback_lines 10000
enable_audio_bell no
window_padding_width 6
confirm_os_window_close 0

include theme.conf

# Optional appearance for the current desktop; other sessions keep theme.conf.
globinclude desktop-${XDG_CURRENT_DESKTOP}.conf

# --- remote control ---
# Lets the agent launchers (open-claude, handoff-claude, handoff-codex) open a
# tab in this window with `kitty @ --to $KITTY_LISTEN_ON launch --type=tab`.
# They run without a terminal attached, so they need the socket; socket-only
# refuses control from escape codes printed inside the terminal. Read at
# startup only: kitty windows that were already open don't get it.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Disable middle-click paste (primary selection paste is bollocks)
mouse_map middle release ungrabbed no_op
